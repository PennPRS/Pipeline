  # ---- 5.7 Evaluation with Individual-Level Data ---------------------------
  - id: "5.7"
    section: "5.7"
    name: "Evaluation with Individual-Level Data"
    script: test/job_submission/Evaluation.sh
    submissionID: Evaluation
    # argument order per wiki:
    #   PennPRS_path  ID_col  pheno_col  covar_col_nums  homedir  phenofile  bfile  PRSdir
    args:
      - ${PennPRS_path}
      - ${eval_homedir}
      - ${eval_phenofile}
      - ${eval_bfile}
      - ${eval_PRSdir}
      - "1"                   # ID_col_num
      - "2"                   # pheno_col_num
      - "3-44"                # covar_col_nums (42 covariates)
    slurm: { time: "00:30:00", cpus: 1, mem_per_cpu: 5000M }
    expect:
      # Evaluation writes directly into eval_homedir; the verifier expects
      # evaluation_results.txt to be present with >= 1 data row.
      dir: ${eval_homedir}
      required_file: evaluation_results.txt
