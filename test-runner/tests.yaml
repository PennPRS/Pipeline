# ============================================================================
# PennPRS Pipeline — Test Runner Configuration
# ============================================================================
# Drives worked examples 5.1 — 5.7 from
#   https://github.com/PennPRS/Pipeline/wiki
#
# All tests are submitted via `sbatch`. The runner sequentially submits jobs
# with `sbatch --wait` by default; pass `--parallel N` to `run_all.sh` to
# queue up to N jobs at once.
#
# Each test has a unique `id` (used on the command line) and a unique
# `submissionID` (used by PennPRS to name its output folder). The verifier
# uses `submissionID` to locate the output folder after the job completes,
# so naming-convention changes in the pipeline do not break verification.
# ============================================================================

globals:
  # Path to the cloned https://github.com/PennPRS/Pipeline checkout.
  PennPRS_path: /scratch/bell/bingxin/PennPRS/revision/PennPRS/

  # Output folders (per-wiki conventions).
  homedir:         ${PennPRS_path}/test/PennPRSoutput/
  eval_homedir:    ${PennPRS_path}/test/Evaluation/output/
  input_GWAS_path: ${PennPRS_path}/test/inputGWAS/

  # Evaluation inputs.
  eval_phenofile:  ${PennPRS_path}/test/Evaluation/pheno/pheno.txt
  eval_bfile:      ${PennPRS_path}/test/Evaluation/geno/validation
  eval_PRSdir:     ${PennPRS_path}/test/Evaluation/PRSdir/

  # SLURM defaults — override per-test under `slurm:` if needed.
  slurm:
    partition: cpu
    qos: normal
    nodes: 11
    ntasks: 1

# ============================================================================
# Test matrix
# ============================================================================
# Runtime/memory figures are taken from the wiki's Test Examples table and
# are based on the bundled inputs on a mid-range Intel Xeon. Override if
# your cluster differs.
# ============================================================================

tests:

  # ---- 5.1 Single-Ancestry Pseudo-Training ---------------------------------
  - id: "5.1a"
    section: "5.1"
    name: "Single-Ancestry Pseudo-Training — EUR, continuous (C+T, lassosum2, LDpred2-pseudo)"
    script: test/job_submission/SA-Pseudo.sh
    submissionID: SApseudo_continuous
    args:
      - ${PennPRS_path}
      - ${homedir}
      - ${input_GWAS_path}
      - SApseudo_continuous              # submissionID
      - "C+T,lassosum2,LDpred2"   # methods
      - testcontinuous                   # trait
      - EUR                              # race
      - "TRUE"                           # ensemble
      - "11"                              # NCORES
    slurm: { time: "02:00:00", cpus: 11, mem_per_cpu: 1000M }
    expect:
      base: ${homedir}
      min_weight_files: 3        # one per method
      weight_glob: "*.txt"

  - id: "5.1b"
    section: "5.1"
    name: "Single-Ancestry Pseudo-Training — EUR, binary"
    script: test/job_submission/SA-Pseudo.sh
    submissionID: SApseudo_binary
    args:
      - ${PennPRS_path}
      - ${homedir}
      - ${input_GWAS_path}
      - SApseudo_binary
      - "C+T,lassosum2,LDpred2"
      - testbinary
      - EUR
      - "TRUE"
      - "11"
    slurm: { time: "02:00:00", cpus: 11, mem_per_cpu: 1000M }
    expect:
      base: ${homedir}
      min_weight_files: 3
      weight_glob: "*.txt"

  # ---- 5.2 Single-Ancestry PRS-CS ------------------------------------------
  - id: "5.2a"
    section: "5.2"
    name: "Single-Ancestry PRS-CS (grid) — EUR, continuous"
    script: test/job_submission/PRS-CS.sh
    submissionID: PRSCSpseudo_continuous
    args:
      - ${PennPRS_path}
      - ${homedir}
      - ${input_GWAS_path}
      - PRSCSpseudo_continuous
      - testcontinuous
      - EUR
      - "11"      # N_THREADS  (PRS-CS runs one chain per chromosome)
      - grid      # type: auto | grid
      - "1e-4,1e-6"      # phi values
    slurm: { time: "04:00:00", cpus: 11, mem_per_cpu: 1500M }
    expect:
      base: ${homedir}
      min_weight_files: 1
      weight_glob: "*.txt"

