      - "1e-4,1e-6"
    slurm: { time: "04:00:00", cpus: 11, mem_per_cpu: 1500M }
    expect:
      base: ${homedir}
      min_weight_files: 1
      weight_glob: "*.txt"


  - id: "5.2c"
