    submissionID: PRSCSauto_fullyBayes_continuous
    args:
      - ${PennPRS_path}
      - ${homedir}
      - ${input_GWAS_path}
      - PRSCSauto_fullyBayes_continuous
      - testcontinuous
      - EUR
      - "11"
      - auto      # type: auto | grid
      - "NA"      # phi values, no need to specify
    slurm: { time: "04:00:00", cpus: 11, mem_per_cpu: 1500M }
    expect:
      base: ${homedir}
      min_weight_files: 1
      weight_glob: "*.txt"

  - id: "5.2d"
    section: "5.2"
    name: "Single-Ancestry PRS-CS (auto) — EUR, binary"
